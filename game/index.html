/* 물건 옮기기 · 더하기 · 빼기 (같은 물건 · 같은 위치는 한 줄로 합친다) */
/* 성좌 경매장 (코인) → engine/star.js */
/* 장비는 한 개씩 따로 (내구도가 하나마다 다르다) */
function invAdd(item,qty,loc,dur){const inv=invOf(),it=DB.items[item];if(it&&GEAR.slotOf(it)){for(let k=0;k<qty;k++)inv.push({item,qty:1,loc,dur:dur??GEAR.maxDur(it)??undefined});return}const r=inv.find(x=>x.item===item&&x.loc===loc);if(r)r.qty+=qty;else inv.push({item,qty,loc})}
function invTake(i,qty){const inv=invOf(),r=inv[i];if(!r)return 0;const n=Math.min(qty,r.qty);r.qty-=n;if(r.qty<=0)inv.splice(i,1);return n}

/* 물건 사용 (use 데이터). 게이트 안에서는 공략 중인 내 HP · MP에 적용 */
function useItem(i){const r=invOf()[i];if(!r)return;const it=DB.items[r.item],u=it.use;if(!u)return;const R=raidActive()?UI.raid:null,me=R?R.party[0]:null,out=[];
  if(u.mp){if(me)me.mp=clamp(me.mp+u.mp);else G.cond.mp=clamp((G.cond.mp??100)+u.mp);out.push(`MP +${u.mp}%`)}
  if(u.hp){if(me)me.hp=clamp(me.hp+u.hp);else G.cond.hp=clamp(G.cond.hp+u.hp);out.push(`HP +${u.hp}%`)}
  if(u.energy){G.cond.energy=clamp(G.cond.energy+u.energy,0,energyMax());out.push(`기력 +${u.energy}`)}
  if(u.cure){const j=(G.injuries||[]).findIndex(x=>x.type===u.cure);if(j>=0){out.push(`${injTxt(G.injuries[j])} 치료`);G.injuries.splice(j,1)}}
  invTake(i,1);if(R){addLog('r',`${it.name} 사용 (${out.join(', ')||'효과 없음'})`);drawRaid()}else{toast(`<b>${esc(it.name)}</b> 사용 — ${out.join(', ')||'효과 없음'}`);render()}}
/* 장비 착용: 같은 부위에 이미 착용한 물건은 가방으로 옮긴다 */
/* 직접 착용은 검사용 옛 화면에서만 (관찰형: 무엇을 입을지는 헌터가 정한다, GEAR.consider) */
function equip(i,on){const r=invOf()[i];if(!r)return;const it=DB.items[r.item];if(!GEAR.equip(i,on))return;
  UI.invSel=G.inv.indexOf(r);toast(`${esc(it.name)} ${on?'착용':'착용 해제'}`)}
/* ---------- 상점 (성좌가 코인으로 사서 헌터에게 선물 — engine/star.js STAR.gift) ---------- */
const shopLeft=s=>{G.shop=G.shop||{};return s.stock==null?null:(G.shop[s.id]??s.stock)};

const coinPrice=w=>Math.max(1,Math.round((w||0)/DB.balance.BAL_COIN.wonPerCoin));
const coinTxt=n=>`<span class="coin">◈ ${Math.round(n).toLocaleString()}</span>`;
const shopCoin=s=>s.coin??coinPrice(s.price);
const sellPrice=it=>it.price?Math.max(1,Math.floor(coinPrice(it.price)*DB.balance.BAL_SHOP.sellRate)):0;
function coinsFor(kills,gateLv,ok){const B=DB.balance.BAL_COIN;return Math.round(kills*B.perKill*Math.pow(21-gateLv,B.rankExp)*(ok?1:B.retreat))}
function shopTotHTML(){const q=Math.max(1,UI.shopQty||1);
  if(UI.shopTab==='sell'){const r=invOf()[UI.shopSel];if(!r)return '';const it=DB.items[r.item];return `합계 <b class="num good">+${coinTxt(sellPrice(it)*Math.min(q,r.qty))}</b>`}
  const s=DB.sysShop[UI.shopSel];if(!s)return '';const t=shopCoin(s)*q;return `합계 <b class="num ${t>(G.coin||0)?'bad':''}">${coinTxt(t)}</b> · 결제 후 잔여 <span class="num">${coinTxt((G.coin||0)-t)}</span>`}

function gateStatus(g){const st=gateSt(g.id);if(st.status==='cleared')return['클리어','g'];if(st.status==='broken'||gateLeft(g)<=0)return['브레이크','b'];

function gateTabs(){const P=prefs(),T=P.gateTabs||(P.gateTabs={order:GT_DEF.map(t=>t.id),hidden:[],custom:[]});const all=[...GT_DEF,...T.custom];GT_DEF.forEach(t=>{if(!T.order.includes(t.id))T.order.push(t.id)});
  return {T,all:T.order.map(id=>all.find(t=>t.id===id)).filter(Boolean),shown:T.order.filter(id=>!T.hidden.includes(id)).map(id=>all.find(t=>t.id===id)).filter(Boolean)}}

function gateRaiding(g){if(UI.raid&&!UI.raid.done&&UI.raid.gid===g.id)return {by:G.player.guild?`${guildName(G.player.guild)} (나)`:'나의 파티',me:true};const now=nowAbs(),e=(G.simQ||[]).find(q=>q.gid===g.id&&q.t>now&&(q.s??q.t-180)<=now);return e?{by:e.by,until:e.t}:null}

    <div class="panel pb tight"><div class="tw"><table><thead><tr><th>이름</th><th class="r">나이</th><th>등급</th><th>역할</th><th>상태</th><th>사기</th><th>컨디션</th><th>계약 만료</th><th class="r">배분율</th><th>ID</th></tr></thead><tbody>
    ${mem.map(h=>hunterRow(h,[h=>`<td><b>${h.name}</b>${h.id===p.id?' <span class="chip a">나</span>':''}${h.id===g.master?' <span class="chip w">길드장</span>':''}</td>`,h=>`<td class="r num">${h.age??'—'}</td>`,h=>`<td>${rkBadge(h.rank)}</td>`,h=>`<td>${DB.roles[h.roleMain]?.name||''}</td>`,h=>`<td><span class="chip ${h.status==='정상'?'g':'b'}">${h.status}</span></td>`,h=>`<td>${h.morale||'—'}</td>`,h=>`<td style="min-width:90px">${bar(h.fit||70,'hp'+((h.fit||70)<65?' low':''))}</td>`,h=>`<td class="num">${h.contract?.until||'—'}</td>`,h=>`<td class="r num">${h.contract?.share??'—'}%</td>`,h=>`<td class="dim num">${h.id}</td>`])).join('')}</tbody></table></div></div>`}
V.guild=()=>{const p=G.player,g=p.guild?DB.guilds[p.guild]:null,tabs=g?['내 길드',...(isMaster()?['영입 · 관리']:[]),'길드 목록']:['길드 목록','길드 창설'];if(!tabs.includes(UI.guildTab))UI.guildTab=tabs[0];
  const head=g?`<div class="h-row"><div class="row" style="gap:12px">${crest(g.id,44)}<div><h1 class="h1">${g.name}</h1><div class="sub">${DB.ranks[g.rank].name}급 길드 · ${guildTier(g).name} · 길드장 ${g.master?nameOf(g.master):'—'} · 내 계약 배분율 ${p.contract.share}% · 만료 ${p.contract.until}</div></div></div>
    ${(G.offers||[]).filter(o=>o.renew&&o.exp>nowAbs()).map(o=>{const i=(G.offers||[]).filter(x=>x.exp>nowAbs()).indexOf(o);return `<span class="row"><span class="warn">재계약 제안: 배분율 ${o.share}% · ${o.months}개월</span><button class="btn pri" data-offer="${i}|ok">재계약</button><button class="btn" data-offer="${i}|neg" ${o.neg?'disabled':''}>협상</button></span>`}).join('')}

function render(){

  if(UI.mode==='title'){root.innerHTML=titleHTML();startBg();return}
  if(UI.mode==='starmake'){root.innerHTML=STARACC.makeHTML();return}
  if(UI.mode==='starintro'&&UI.sintro){root.innerHTML=STARACC.introHTML();return}
  if(UI.mode==='starpick'){root.innerHTML=STARACC.pickHTML();return}
  if(UI.mode==='starpreset'){root.innerHTML=STARACC.presetHTML();return}
  if(UI.mode==='intro'&&UI.intro){$('#root').innerHTML=introHTML();return}
  if(UI.mode==='create'){const sc=$('#ccmain')?.scrollTop||0;root.innerHTML=ccHTML();if($('#ccmain'))$('#ccmain').scrollTop=UI.ccKeepScroll?sc:0;UI.ccKeepScroll=false;if(UI.cc.step===4)mountTraitList();return}

  if(UI.screen==='messenger'){const th=G.threads.find(t=>t.with===UI.thWith)||G.threads[0];if(th)th.unread=0}
  renderTop(); renderNav();
  if(UI.screen==='squad')UI.screen='guild';
  if(!V[UI.screen]||(UI.screen==='raid'&&!UI.raid)||(UI.screen==='raidresult'&&!UI.raidResult)||(UI.screen==='raidprep'&&!UI.prep)) UI.screen='life';
  $('#main').innerHTML=STORY.josa(V[UI.screen]());
  if(UI.screen==='raid') drawRaid();
  if(UI.screen==='acts') mountMap();
  if(typeof LIFEUI!=='undefined') LIFEUI.after();
  const ch=$('#chat'); if(ch) ch.scrollTop=ch.scrollHeight;
  if(typeof OBSERVE!=='undefined')OBSERVE.clean(root);
}

/* 능력치 직접 입력: 입력 중에는 합계만 갱신, 칸을 벗어나면 범위로 맞춘다 */
function abInput(el,fix){
  const cc=UI.cc,d=el.dataset,B=DB.balance.BAL_GROWTH;let v=parseInt(el.value,10);if(isNaN(v)){if(!fix)return;v=+el.min}
  v=Math.max(+el.min,Math.min(+el.max,v)); if(fix) el.value=v;
  if(d.abv){cc.ab.abl[d.abv]=v;el.className='abin '+vcls(v)} else if(d.abs) cc.ab.stats[d.abs]=v; else if(d.abk){cc.ab.looks=cc.ab.looks||{};cc.ab.looks[d.abk]=v} else cc.ab.pot[d.abp]=v;
  cc.ab.mode='manual';
  const t=$('#abtot');if(t)t.innerHTML=abTotHTML(cc);
  if(d.abs){const vt=vitals({stats:cc.ab.stats});$('#abhp').textContent=vt.hp;$('#abmp').textContent=vt.mp}
}

  if(d.setsel){SETTINGS[d.setsel]=d.setsel==='textSpeed'?el.value:+el.value;applySettings();return}
  if(d.mvreg){UI.mvReg=el.value;render();return}
  if(d.pgate){partySetGate(el.value);render();return}
  if((d.schact||d.schat||d.schdur)&&UI.schSel){ROUTINE.state().mode='manual';const {d:dd,i}=UI.schSel,b=G.schedule[dd][i];if(d.schact)b.act=el.value;if(d.schat)b.at=+el.value;if(d.schdur)b.dur=+el.value;G.schedule[dd].sort((x,y)=>x.at-y.at);UI.schSel={d:dd,i:G.schedule[dd].indexOf(b)};render();return}
  if(!cc) return;
  if(d.tsort){cc.tsort=el.value;refreshTraitUI(true);return}
  if((d.abv||d.abs||d.abp||d.abk)&&cc.ab){abInput(el,true);return}
  if(d.cc){cc[d.cc]=el.value;UI.ccKeepScroll=true;render();return}
  if(d.ccv){cc[d.ccv]=d.ccv==='age'?+el.value:el.value;if(d.ccv==='sex')ensureLook(cc);UI.ccKeepScroll=true;render();return}

});
