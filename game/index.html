<title>K-Hunter-Life</title>
<link rel="stylesheet" href="life.css">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 타이틀(전체 화면) → 캐릭터 생성(전체 화면 마법사) → 게임(FM식 좌측 내비 + 상단 길드 컬러 바 + 본문). 의도적으로 다크 단일 테마. */
:root{
  color-scheme: dark;
  --bg:#0e131a; --panel:#151c26; --panel2:#1b2431; --line:#243042; --line2:#2f3d52;
  --fg:#dbe2ec; --muted:#8392a6; --dim:#5b6879;
  --accent:#4fa8e0; --accent-ink:#06121c;
  --club:#7e2231; --club2:#a33446; --club-ink:#fbeef0;
  --good:#5cc48a; --warn:#e0a341; --bad:#e05a5a;
  --a1:#66717f; --a2:#c3cad4; --a3:#e8c75a; --a4:#f2774f;
  --keyrow:#1c3550;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --fs:13px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#root{height:100%}

/* ---------- 공통 ---------- */
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.h1{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 320px}
.g-side-l{grid-template-columns:300px minmax(0,1fr)}
.span2{grid-column:span 2}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:12px;letter-spacing:.02em}
.ph .more{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:11px}
.pb{padding:12px}
.pb.tight{padding:0}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr[data-hunter],tbody tr[data-gate]{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
tr.sel td{background:#20304a}
.stw{border:1px solid #3d7fb8;border-radius:6px;background:linear-gradient(180deg,#132d4b,#0b1a2e);box-shadow:inset 0 0 28px rgba(79,168,224,.16),0 0 0 1px rgba(79,168,224,.1);padding:18px 20px;display:grid;gap:14px;min-width:0}
.stw-t{text-align:center;letter-spacing:.4em;color:#9fd2f5;font-size:13px;font-weight:600}
.stw-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(79,168,224,.18);padding:6px 2px;min-width:0}
.stw-row .k{color:#7fb4d9;font-size:12px;width:64px;flex:none}
.stw-row .v{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.stw-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.stw-stats .stw-row .v{font-family:var(--f-num);text-align:right}
.stw-bar{height:5px;background:rgba(79,168,224,.15);border-radius:3px;overflow:hidden;margin:2px 2px 6px}
.stw-bar i{display:block;height:100%}
.stw-sk{display:flex;flex-wrap:wrap;gap:6px}
.stw-sk span{border:1px solid rgba(79,168,224,.35);border-radius:3px;padding:2px 8px;font-size:12px;color:#d6ecfb}
.sw2{container-type:inline-size;border:1px solid #3d7fb8;background:#0c1b2e;box-shadow:inset 0 0 0 1px rgba(79,168,224,.08),0 0 24px rgba(79,168,224,.08);min-width:0}
.sw2-c .v,.sw2-m{white-space:nowrap}
@container (max-width:520px){.sw2-g.r1{grid-template-columns:repeat(2,minmax(0,1fr))!important}.sw2-g.r2{grid-template-columns:minmax(0,1fr)!important}.sw2-g.r3{grid-template-columns:repeat(2,minmax(0,1fr))!important}.sw2-st .v{font-size:18px}.sw2-sk{grid-template-columns:minmax(0,1fr)}}
.sw2-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:rgba(79,168,224,.13);border-bottom:1px solid #2d5f8a;color:#9fd2f5;font-size:12px;font-weight:600;letter-spacing:.3em}
.sw2-g{display:grid;gap:1px;background:#1e4466;border-bottom:1px solid #1e4466}
.sw2-c{background:#0c1b2e;padding:8px 11px;min-width:0;display:grid;gap:3px;align-content:start}
.sw2-c .k{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:#7fb4d9}
.sw2-c .v{font-size:15px;font-weight:600;color:#e6f2fb;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.sw2-st .v{font-size:22px;font-family:var(--f-num);justify-content:flex-end}
.sw2-m b{font-size:15px;color:#e6f2fb}.sw2-m span{font-size:12px;color:#7fb4d9}
.sw2-m+.stw-bar{margin:3px 0 0}
.sw2-sec{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:11px;color:#9fd2f5;letter-spacing:.1em;background:rgba(79,168,224,.06);border-bottom:1px solid #1e4466}
.sw2-sk{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));background:#0c1b2e;gap:0}.sw2-sk .sw2-c{box-shadow:inset -1px -1px 0 #1e4466}
.sw2-inj{display:grid;gap:2px;font-size:11px;color:#f2a3a3;margin-top:4px}.sw2-inj i{font-style:normal;color:#7fb4d9;margin-left:4px}
.sw2-note{font-size:11px;color:#e0a341;margin-top:3px}
.sw2w{border:0;box-shadow:none;height:100%}.sw2-mini{display:grid;grid-template-columns:30px 1fr 44px;align-items:center;gap:8px;font-size:11px;color:#7fb4d9}.sw2-mini .stw-bar{margin:0}.sw2-mini .num{text-align:right;color:#e6f2fb}
.sw2 .pub{font-size:10px;padding:0 6px;border-radius:2px}
.gmap{position:relative;aspect-ratio:1;background:#0b1119;overflow:hidden;user-select:none}.gmap canvas{position:absolute;inset:0;width:100%;height:100%}
.gml{position:absolute;transform:translate(-50%,-50%);font-size:11px;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #000,0 0 6px #000;letter-spacing:-.02em}
.gml.on{color:#e6f2fb;font-weight:600}.gml.off{color:#6d7d90;font-size:10px}.gml.sel{color:#fff;font-size:12px}.gml i{font-style:normal;display:inline-block;margin-left:3px;background:#c84848;color:#fff;border-radius:8px;padding:0 5px;font-size:10px;font-weight:700}
.intro{position:fixed;inset:0;background:#000;display:grid;place-items:center;cursor:pointer;z-index:5;overflow:hidden}
.in-stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#05080c;animation:inFade var(--fd,.9s) ease both}
.in-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none}
.in-stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,#000c 55%,#000e);pointer-events:none}
.in-cap{position:absolute;left:7%;right:7%;bottom:6%;z-index:1;display:grid;gap:10px;animation:inUp calc(var(--fd,.9s) + .3s) ease both}
.in-head{font-family:var(--f-display);font-size:clamp(26px,3.6vw,52px);line-height:1.1;color:#f3f6fa;text-shadow:0 2px 18px #000}
.in-text{margin:0;font-size:clamp(14px,1.35vw,20px);line-height:1.7;color:#d6dde6;max-width:60em;word-break:keep-all;text-shadow:0 1px 8px #000}
.in-hint{font-size:12px;color:#8a98aa}
.in-sw .psw{border:1px solid rgba(79,168,224,.6);background:rgba(10,24,40,.82);box-shadow:0 0 0 1px rgba(79,168,224,.12),0 0 46px rgba(79,168,224,.25);padding:16px 20px;color:#e6f2fb;cursor:default}
.in-sw .hd{font-family:var(--f-num);font-size:12px;letter-spacing:.3em;color:#9fd2f5;margin-bottom:12px;border-bottom:1px solid rgba(79,168,224,.3);padding-bottom:8px}
.in-sw .pkv{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:0;font-size:15px}.in-sw .pkv dt{color:#7fb4d9}.in-sw .pkv dd{margin:0;font-weight:600}
@keyframes swIn{0%{opacity:0;filter:blur(6px);transform:scale(.97)}60%{opacity:.9;filter:blur(0)}100%{opacity:1;transform:none}}
.in-sw{position:absolute;left:28%;width:44%;top:12%;height:40%;display:grid;place-items:center;z-index:1}.in-sw .psw{width:min(100%,420px);animation:swIn 1.4s .3s ease both}
.in-bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;z-index:2;background:linear-gradient(#000a,transparent)}
.in-dots{display:flex;gap:6px}.in-dots i{width:22px;height:2px;background:#ffffff33;display:block}.in-dots i.on{background:var(--accent)}
.in-end{display:grid;gap:22px;justify-items:center;animation:inFade 1s ease both}.in-endt{font-family:var(--f-display);font-size:clamp(22px,2.6vw,38px);color:#e6f2fb;text-align:center;padding:0 20px}
@keyframes inFade{from{opacity:0}to{opacity:1}}@keyframes inUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in-stage,.in-cap,.in-end,.in-sw .psw{animation:none}}
.gmtip{position:absolute;pointer-events:none;background:#0d1520ee;border:1px solid var(--line2);padding:3px 8px;font-size:12px;white-space:nowrap;z-index:2}
.mplace{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);background:var(--panel2)}
.mplace small{display:block;color:var(--muted);font-size:11px}.mplace .ic{text-align:center;color:var(--muted)}.mplace.on{border-color:var(--accent);background:#16263a}.mplace:focus-visible{outline:2px solid var(--accent)}
@media (max-width:900px){.rgrid{grid-template-columns:minmax(0,1fr)!important}.gcell{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qsbtn{all:unset;cursor:pointer;display:block;border-radius:6px}.qsbtn:focus-visible,.qsname:focus-visible{outline:2px solid var(--accent)}
.qsname{all:unset;cursor:pointer}.qsname:hover{text-decoration:underline}.qsk{font-size:11px;color:var(--muted);margin-left:6px;opacity:0;transition:opacity .15s}.crumb[data-qsopen]{cursor:pointer}.crumb[data-qsopen]:hover .qsk{opacity:1}
.qsbg{position:fixed;inset:0;background:#05080cb0;z-index:60}
.qsp{position:fixed;left:50%;top:70px;transform:translateX(-50%);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--accent);box-shadow:0 18px 60px #000c;z-index:61}
.qsin{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.qsin span{color:var(--accent);font-size:18px}
.qsin input{flex:1;all:unset;flex:1;font-size:16px;color:var(--fg)}.qsin kbd{font:11px var(--f-num);color:var(--dim);border:1px solid var(--line2);padding:1px 5px}
.qsr{overflow:auto;padding:4px 0}.qsc{font-size:10px;letter-spacing:.14em;color:var(--dim);padding:8px 14px 3px}
.qsi{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px minmax(0,auto) minmax(0,1fr);gap:10px;align-items:center;padding:6px 14px}
.qsi.on,.qsi:hover{background:#18283a}.qsn{font-weight:600;white-space:nowrap}.qss{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qsd{width:8px;height:8px;border-radius:50%;background:var(--line2);justify-self:center}
.qsf{font-size:11px;color:var(--dim);padding:6px 14px;border-top:1px solid var(--line)}
.ivp{position:fixed;left:50%;top:60px;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--rc);box-shadow:0 0 0 1px #0008,0 18px 60px #000c;z-index:61;outline:0}
.infop{padding-top:4px}.infop .ph{display:flex;justify-content:space-between;padding:10px 44px 10px 14px;border-bottom:1px solid var(--line);font-weight:600}.ivx{position:absolute;right:10px;top:8px}
.ivh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 22%,#121a24),#121a24 60%);border-bottom:1px solid var(--line)}
.ivic{width:52px;height:52px;border:2px solid var(--rc);display:flex;align-items:baseline;justify-content:center;padding-top:8px;background:#0c1118}.ivic b{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--rc)}.ivic span{font-size:11px;color:var(--rc)}
.ivn{font-family:var(--f-display);font-size:22px;line-height:1.15}.ivs{font-size:12px;color:var(--muted)}
.ivb{padding:12px 14px;display:grid;gap:12px}.ivd{margin:0;line-height:1.7}
.ivg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.ivc{background:var(--panel);padding:9px 11px;display:grid;gap:4px;font-size:12px;align-content:start}.ivc>.k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.ireqs{display:flex;flex-wrap:wrap;gap:4px}.ireq{border:1px solid var(--line2);padding:2px 7px;font-size:12px}.ireq.ok{border-color:#2f6b4a;color:#bff0d2}.ireq.no{border-color:#7a3434;color:#f2a3a3}.ireq small{color:var(--muted)}
@media (max-width:600px){.ivg{grid-template-columns:1fr}}
.coin{color:#e8c75a;white-space:nowrap}
.pub{all:unset;cursor:pointer;font-size:10px;padding:1px 7px;border-radius:9px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;flex:none}
.pub[aria-pressed="true"]{border-color:#3d7fb8;color:#9fd2f5}
.pub:focus-visible{outline:2px solid var(--accent)}
.skrow td:first-child{font-weight:600}
td.r,th.r{text-align:right}
.rk{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:3px;font-weight:700;font-size:11px;color:#0b0f14}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;background:none}
button.chip{cursor:pointer}
.chip.g{border-color:#2f6b4a;color:var(--good)} .chip.w{border-color:#6e5420;color:var(--warn)} .chip.b{border-color:#6e2a2a;color:var(--bad)} .chip.a{border-color:#245272;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.badge{margin-left:auto;background:var(--club2);color:var(--club-ink);font-size:10px;border-radius:8px;padding:0 6px;font-weight:700;line-height:16px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.hp i{background:var(--good)} .hp.low i{background:var(--bad)} .mp i{background:#6a8cff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.big{font-family:var(--f-display);font-size:26px;line-height:1}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.club{background:var(--club2);color:var(--club-ink);border-color:var(--club2);font-weight:700}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.avatar{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#0b0f14}
.trig{margin-top:14px;padding:10px 12px;border:1px dashed var(--line2);border-radius:4px;font-size:11px;color:var(--muted)}
.trig b{color:var(--warn);font-weight:600}
body.no-trig .trig.dev{display:none}
.result{padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel2);margin-top:8px}
.proto{font-size:10px;letter-spacing:.1em;border:1px solid var(--line2);color:var(--warn);padding:1px 6px;border-radius:3px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--accent);padding:10px 14px;border-radius:4px;max-width:340px;font-size:12px;z-index:50}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-size:11px;color:var(--muted)}
.field input[type=text],.field select{background:var(--bg);border:1px solid var(--line2);border-radius:3px;color:var(--fg);padding:7px 9px;font:inherit;width:100%}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
.fx{font-size:11px;color:var(--dim);min-height:16px}
.fx b{color:var(--good);font-weight:500}.fx i{color:var(--bad);font-style:normal}

/* ---------- 초상화 / 문장 슬롯 ---------- */
.por{position:relative;width:var(--s,96px);aspect-ratio:1/1.08;max-width:100%;border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#24344b,#121925 75%);border:1px solid var(--line2);flex:none}
.por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.por .ph-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.por svg{width:56%;height:auto;margin-top:12%}
.por small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--f-num);font-size:9px;color:var(--dim);letter-spacing:.02em}
.gcell{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.gcell>div{background:var(--panel2);border:1px solid var(--line);padding:7px 9px;display:grid;gap:2px}.gcell span{font-size:11px;color:var(--muted)}.gcell b{font-size:13px;font-weight:600}
.crest{width:var(--s,36px);height:var(--s,36px);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--s,36px)*.5);flex:none;position:relative;overflow:hidden}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

/* ---------- 타이틀 ---------- */
.title-scr{position:relative;height:100%;overflow:hidden;background:#06090e;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
#bgfx{position:absolute;inset:0;width:100%;height:100%;display:block}
.t-left{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:6vh;padding-left:max(24px,6vw,env(safe-area-inset-left,0px));padding-right:16px}
.t-eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.4em;color:#7fa9c9}
.t-logo{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,7vw,112px);white-space:nowrap;line-height:.95;margin:6px 0 0;color:#f3f6fa;letter-spacing:-.01em;text-shadow:0 0 40px #4fa8e055}
.t-tag{color:#9fb0c4;font-size:15px;max-width:34ch}
.t-menu{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.t-menu button{all:unset;cursor:pointer;font-size:20px;font-weight:600;color:#c9d4e2;padding:7px 0 7px 18px;border-left:3px solid transparent;transition:color .15s,border-color .15s,padding .15s}
.t-menu button:hover,.t-menu button[aria-current="true"]{color:#fff;border-left-color:var(--accent);padding-left:24px}
.t-menu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t-menu button small{display:block;font-size:11px;font-weight:400;color:#6f8299}
.t-foot{font-size:11px;color:#5d6d81;font-family:var(--f-num)}
.t-right{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;padding-block:6vh;padding-right:max(24px,5vw,env(safe-area-inset-right,0px));padding-left:16px;min-width:0}
.t-panel{width:min(440px,100%);background:#0e141ce6;border:1px solid #2a3a50;border-radius:6px;backdrop-filter:blur(6px);max-height:80vh;overflow:auto}
.t-panel .ph{font-size:14px}
.slot{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.slot .info{flex:1;min-width:0}
.slot .info b{display:block}
.slot .info>span{font-size:11px;color:var(--muted)}
.tgl{all:unset;cursor:pointer;width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:left .15s}
.tgl[aria-pressed="true"]{background:var(--accent)}
.tgl[aria-pressed="true"]::after{left:19px}
.tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 캐릭터 생성 ---------- */
.cc{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
.cc-top{display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.cc-top .t{font-family:var(--f-display);font-size:20px}
.cc-body{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:0}
.steps{display:flex;flex-direction:column;border-right:1px solid var(--line);overflow-y:auto;padding-left:env(safe-area-inset-left,0px)}
.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.steps button[aria-current="step"]{background:var(--panel2);color:var(--fg);font-weight:600}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.steps .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;font-family:var(--f-num);flex:none}
.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done .n{border-color:var(--good);color:var(--good)}
.cc-main{overflow-y:auto;padding:20px 24px 32px;min-width:0}
.cc-main h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px}
.cc-main .lead{color:var(--muted);margin:0 0 18px;max-width:60ch}
.cc-side{border-left:1px solid var(--line);overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px;background:var(--panel)}
.cc-foot{display:flex;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel)}
.trait{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:3px;font-size:12px;background:var(--panel2)}
.trait[aria-pressed="true"]{border-color:var(--accent);background:#1c3047}
.trait:focus-visible{outline:2px solid var(--accent)}
.trait .c{font-family:var(--f-num);font-weight:600}
.trait small{display:block;color:var(--muted);font-size:11px}
.pts{font-family:var(--f-num);font-size:22px;font-weight:600}
.cc-look{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}

/* ---------- 게임 셸 ---------- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.side{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.logo{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.logo b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em;display:block;line-height:1.1}
.logo span{font-size:10px;color:var(--muted);letter-spacing:.14em}
.nav{display:flex;flex-direction:column;padding:8px 0;overflow-y:auto;flex:1}
.nav .grp{font-size:10px;letter-spacing:.14em;color:var(--dim);padding:12px 16px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 16px;color:var(--muted);border-left:3px solid transparent}
.nav button:hover{background:var(--panel2);color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--panel2);border-left-color:var(--club2);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav .ic{width:16px;text-align:center;font-size:12px;opacity:.8}
.side .foot{padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.top{display:flex;align-items:stretch;background:linear-gradient(90deg,var(--club),#1d1418 70%,var(--panel));border-bottom:1px solid var(--line);min-height:56px;padding-right:env(safe-area-inset-right,0px)}
.crumb{display:flex;align-items:center;gap:12px;padding:8px 16px;min-width:0;flex:1}
.crumb .t1{font-family:var(--f-display);font-size:18px;line-height:1.1;color:var(--club-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .t2{font-size:11px;color:#e9c9cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px;padding:0 10px}
.tools button{all:unset;cursor:pointer;font-size:11px;color:#f1d9dd;border:1px solid #ffffff33;border-radius:3px;padding:4px 8px}
.tools button:hover{border-color:#fff}
.tools button:focus-visible{outline:2px solid var(--fg)}
.clock{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 14px;border-left:1px solid #ffffff1a;flex:none}
.clock .d{font-weight:600;white-space:nowrap}
.clock .s{font-size:11px;color:#e9c9cf;white-space:nowrap}
.egauge{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 12px;border-left:1px solid #ffffff1a;min-width:120px;flex:none}
.egauge .l{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#e9c9cf;white-space:nowrap}
.egauge .l b{color:#fff;font-family:var(--f-num)}
.egauge .g{height:5px;background:#ffffff22;border-radius:3px;overflow:hidden;position:relative}
.egauge .g i{position:absolute;inset:0 auto 0 0;background:#5cc48a}
.egauge .g s{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(45deg,#ffffff18 0 3px,transparent 3px 6px)}
.advwrap{display:flex;flex:none}
.advmore{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;background:var(--accent);color:var(--accent-ink);border-left:1px solid #00000033;font-size:12px}
.advmore:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.advmenu{position:fixed;top:60px;right:10px;z-index:50;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:0 10px 30px #0008;padding:6px;display:grid;gap:2px;min-width:240px}
.advmenu>button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:4px;font-size:13px}
.advmenu>button:hover,.advmenu>button:focus-visible{background:var(--panel2)}
.savemenu{right:420px;min-width:360px}.svrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
.stw-plus{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border:1px solid #e0a341;color:#e0a341;border-radius:3px;font-size:12px;line-height:1}.stw-plus:hover,.stw-plus:focus-visible{background:#e0a34133}
.locbtn{all:unset;cursor:pointer;color:inherit;border-bottom:1px dotted currentColor}.locbtn:hover,.locbtn:focus-visible{color:var(--fg)}
.locmenu{left:230px;right:auto;max-height:70vh;overflow:auto}
.kbar{margin:-4px 0 10px;padding:6px 10px;border-left:3px solid var(--club2);background:var(--panel2);font-size:12px;color:var(--muted)}.kbar.old{border-left-color:var(--warn);color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:11px}
#busy{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:90;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:8px 14px;font-size:12px;box-shadow:0 8px 24px #0008}
.advmenu small{color:var(--dim);font-size:11px}
.acts{margin-bottom:12px}
.acts .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.acard{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px;background:var(--panel2);padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.acard .t{display:flex;justify-content:space-between;gap:6px;align-items:center}
.acard .t b{font-size:13px}
.acard .d{font-size:11px;color:var(--muted);line-height:1.4}
.acard .fx{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.acard .fx b{font-family:var(--f-num);color:var(--fg);font-weight:600}
.acard .why{font-size:11px;color:var(--bad)}
.acard .warn{font-size:11px;color:var(--warn)}
.acard .row{gap:4px}
.acard.off{opacity:.6}
.tlwrap{overflow-x:auto}
.tl{display:grid;grid-template-columns:40px repeat(7,minmax(92px,1fr));gap:0 4px;min-width:720px}
.tl .hd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;display:flex;justify-content:center;gap:4px;align-items:center}
.tl .hd.today{color:var(--fg);font-weight:700}
.tl .hd button{all:unset;cursor:pointer;font-size:11px;color:var(--accent);padding:0 4px;border-radius:3px}
.tl .hd button:focus-visible{outline:2px solid var(--accent)}
.tl .hrs{position:relative;height:var(--H)}
.tl .hrs span{position:absolute;right:4px;font-size:10px;color:var(--dim);transform:translateY(-50%)}
.tl .col{position:relative;height:var(--H);background:repeating-linear-gradient(180deg,var(--panel2) 0 1px,transparent 1px var(--HR));border:1px solid var(--line);border-radius:3px}
.tl .col.today{border-color:var(--accent)}
.tl .blk{all:unset;cursor:pointer;position:absolute;left:2px;right:2px;border-radius:3px;background:color-mix(in srgb,var(--c) 30%,var(--panel));border-left:3px solid var(--c);font-size:10px;line-height:1.25;padding:2px 4px;overflow:hidden;box-sizing:border-box}
.tl .blk b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .blk.cont{opacity:.55;border-left-style:dashed}
.tl .blk.sel{outline:2px solid var(--fg);z-index:2}
.tl .blk.ovl{box-shadow:inset 0 0 0 1px var(--bad)}
.tl .blk:focus-visible{outline:2px solid var(--accent)}
.tl .now{position:absolute;left:-2px;right:-2px;height:2px;background:var(--bad);z-index:3}
.go{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:8px;padding:0 22px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.go:hover{filter:brightness(1.1)}
.go:focus-visible{outline:2px solid var(--fg);outline-offset:-4px}
.go small{font-weight:500;font-size:10px;display:block;opacity:.8}
.main{overflow-y:auto;min-width:0;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px 16px}

/* 편지함/메신저/위젯 */
.rprog{position:relative;height:18px;margin-top:8px;background:var(--panel2,#1a2330);border-radius:4px;overflow:hidden} .rprog i{position:absolute;inset:0 auto 0 0;background:var(--club2,#4fa8e0);opacity:.55;transition:width .2s} .rprog span{position:relative;font-size:11px;padding-left:8px;line-height:18px}
#packbar{display:contents}
.actlog .li{gap:8px;align-items:baseline} .actlog .al-up .tx{color:var(--good)} .actlog .al-stop .tx{color:var(--warn)} .actlog .al-run .tx{color:var(--fg);font-weight:600} .actlog .al-line .tx,.actlog .al-act .tx{color:var(--muted)}
.chipsel{appearance:none;-webkit-appearance:none;background:none;border:1px solid var(--line2);border-radius:10px;color:var(--fg);font:inherit;font-size:11px;padding:1px 18px 1px 7px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer} .chipsel option{background:var(--bg);color:var(--fg)} .gfbar .chip.on,.chip[data-alcat].on{background:#173049;border-color:#2f6b9a;color:#cfe6ff} .gfbar .field{flex-direction:column}
.gfbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 10px;background:var(--panel,#121a24);border:1px solid var(--line);border-radius:6px} .gfgrp{display:flex;flex-wrap:wrap;gap:4px;align-items:center} .gfgrp .lab{font-size:11px;color:var(--muted,#8a97a8);margin-right:2px} th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--club2,#4fa8e0)} .gtabs{flex-wrap:wrap} /* 타이틀 격자 칸을 차지하지 않게 */
.packbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(420px,80vw);background:#101820;border:1px solid var(--line);border-radius:6px;padding:8px 12px;z-index:50;font-size:12px;color:var(--muted,#9aa)} .packbar i{display:block;height:4px;margin-top:6px;background:var(--club2,#4fa8e0);border-radius:2px;transition:width .2s}
.mail{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mail:hover{background:var(--panel2)} .mail.sel{background:#20304a}
.mail .from{font-weight:600;font-size:12px}
.mail .subj{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail.unread .subj{color:var(--fg)}
.mail .when{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
.msg h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px}
.msg p{max-width:62ch;margin:0 0 10px}
.choice{all:unset;cursor:pointer;display:block;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;margin-bottom:6px;background:var(--panel2)}
.choice:hover{border-color:var(--accent)}
.choice:focus-visible{outline:2px solid var(--accent)}
.choice .ck{font-size:11px;color:var(--muted);margin-top:2px}
.dev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px 6px 0 0;padding:8px 12px}
.dev .nm{font-weight:700;letter-spacing:.04em;font-size:12px}
.dev .stt{margin-left:auto;font-family:var(--f-num);font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.dtabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-top:0;margin-bottom:12px;overflow-x:auto}
.dtabs button{all:unset;cursor:pointer;padding:9px 16px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;border-bottom:2px solid transparent}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600;background:var(--panel)}
.dtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chat{display:flex;flex-direction:column;gap:6px;padding:14px;height:400px;overflow-y:auto}
.bub{max-width:72%;padding:8px 11px;border-radius:12px;background:var(--panel2);align-self:flex-start;font-size:13px}
.bub.me{align-self:flex-end;background:#1f4a6b}
.bub .tm{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.bub .who{display:block;font-size:11px;color:var(--muted);font-weight:600}
.sys{align-self:center;max-width:90%;font-size:12px;padding:8px 12px;border:1px dashed var(--line2);border-radius:6px}
.replies{border-top:1px solid var(--line);padding:10px 12px}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,clamp(170px,calc((100vh - 190px) / 3),300px));gap:12px}
.wg{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.wg .pb{flex:1;min-height:0;overflow:hidden}
.wg.click{cursor:pointer}
.wg.click:hover{border-color:var(--line2);background:#17202b}
.wsz{font-family:var(--f-num);font-size:10px;color:var(--dim);font-weight:500}
.wedit{position:absolute;inset:0;background:#0e131aeb;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:10px;border:2px solid var(--accent);border-radius:4px;text-align:center}
.wedit .nm{font-weight:700}
.wedit.moving{border-color:var(--warn)}
.slot-empty{all:unset;cursor:pointer;border:1px dashed var(--line2);border-radius:4px;display:grid;place-items:center;color:var(--dim);font-size:12px}
.slot-empty:hover,.slot-empty.target{border-color:var(--accent);color:var(--accent)}
.slot-empty[disabled]{opacity:.35;cursor:default}
.slot-empty:focus-visible{outline:2px solid var(--accent)}
.picker{margin-top:12px}
.pbds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pbd{border:1px solid var(--line);background:#ffffff05;padding:10px;display:grid;gap:8px;align-content:start}
.wpop{width:min(980px,calc(100vw - 32px))}
.wpop>.ivx{position:absolute;right:10px;top:8px;z-index:2}
.wp-head{display:flex;gap:6px;align-items:baseline;padding:11px 44px 11px 14px;border-bottom:1px solid var(--line);font-weight:600}
.wp-body{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:420px}
.wp-list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 160px)}
.wp-it{display:grid;gap:2px;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.wp-it:hover{background:#ffffff08}.wp-it[aria-current="true"]{background:#4fa8e01a;box-shadow:inset 3px 0 0 var(--acc,#4fa8e0)}
.wp-main{display:grid;gap:12px;align-content:start;padding:14px;min-width:0}
.wp-prev{display:grid;gap:12px;pointer-events:none;overflow:auto;max-width:100%}
@media (max-width:760px){.wp-body{grid-template-columns:1fr}.wp-list{max-height:180px;border-right:0}}
.picker .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sizes{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.sz{all:unset;cursor:pointer;font-family:var(--f-num);font-size:11px;padding:2px 8px;border:1px solid var(--line2);border-radius:3px}
.sz[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sz[disabled]{opacity:.3;cursor:default}
.sz:focus-visible{outline:2px solid var(--accent)}
.mini{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;min-width:0}
.li .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.li[data-alert]:hover .tx,.li[data-thread]:hover .tx{color:var(--accent)}

/* 일정 / 게이트 / 공략 / 관계 / 재정 */
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(84px,1fr));gap:3px;min-width:680px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .hd.today{color:var(--fg);font-weight:700}
.cal .tm{font-size:11px;color:var(--dim);display:flex;align-items:center}
.cslot{all:unset;cursor:pointer;min-height:44px;border-radius:3px;padding:5px 6px;font-size:11px;line-height:1.3;border-left:3px solid var(--c,var(--line2));background:var(--panel2)}
.cslot:hover{filter:brightness(1.2)}
.cslot:focus-visible{outline:2px solid var(--accent)}
.cslot small{display:block;color:var(--muted)}
.gatehead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.portal{width:64px;height:64px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#0b0f14 30%,var(--pc) 55%,transparent 72%);box-shadow:0 0 22px -4px var(--pc)}
.timer{font-family:var(--f-num);font-weight:600}
.floors{display:flex;align-items:center;margin:4px 0;overflow-x:auto;padding-bottom:4px}
.fl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;font-size:10px;color:var(--dim)}
.fl i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700}
.fl.done i{background:var(--good);border-color:var(--good);color:#0b0f14}
.fl.now i{border-color:var(--accent);box-shadow:0 0 0 4px #4fa8e033;color:var(--accent)}
.fl.boss i{border-color:var(--bad);color:var(--bad)}
.link{flex:1;min-width:16px;height:2px;background:var(--line2);margin-bottom:16px}
.link.done{background:var(--good)}
.log{height:330px;overflow-y:auto;font-size:12px}
.log p{margin:0;padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log p .t{font-family:var(--f-num);color:var(--dim);flex:none;width:42px}
.log p.k{background:#1d2a20}.log p.h{background:#2c1d1f}.log p.e{background:#1d2534;font-weight:600}.log p.c{background:#2e2615;font-weight:600}.log p.r{background:#1b2230}
.crisis{border:1px solid var(--warn);border-radius:6px;background:#2a2312;padding:12px;display:grid;gap:8px;margin:10px}
.crisis h4{margin:0;font-size:14px}
.crisis .ch{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border:1px solid var(--line2);border-radius:4px;background:var(--panel)}
.crisis .ch:hover,.crisis .ch:focus-visible{border-color:var(--accent)}
.crisis .ch[disabled]{opacity:.45;cursor:default}
.crisis .ch small{grid-column:1/-1;color:var(--muted);font-size:11px}
.rk-risk{font-size:11px;padding:0 6px;border-radius:8px;border:1px solid currentColor;white-space:nowrap}
.gbanner{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--bad);background:#2c1d1f;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12px}
.pmem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.pmem input{accent-color:var(--accent)}
.rlist tr{cursor:pointer}
.rdim{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.rdim .bar{position:relative}
.rdim .bar.neg i{background:var(--bad)}
.rdim .rd{color:var(--muted);text-align:right;font-family:var(--f-num)}
.rcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.rcols{grid-template-columns:minmax(0,1fr)}}
.mem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.mem .nm{font-weight:600;font-size:12px}
.mem .bars{grid-column:1/3;display:grid;grid-template-columns:20px 1fr 20px 1fr;gap:4px 6px;align-items:center;font-size:10px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.person{display:flex;gap:10px;padding:12px;align-items:flex-start}
.person .info{flex:1;min-width:0}
.pbtn{all:unset;cursor:pointer;flex:none;border-radius:6px}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meter{display:grid;grid-template-columns:44px 1fr 28px;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:3px}

/* ---------- 헌터 기록부 (정보창 개요) ---------- */
.hf{--rc:#4fa8e0;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,420px);gap:18px;align-items:center;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line2);background:linear-gradient(100deg,color-mix(in srgb,var(--rc) 16%,#101722) 0%,#111924 45%,#0e141d 100%)}
.hf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc)}
.hf::after{content:"";position:absolute;right:8px;top:8px;width:14px;height:14px;border-top:1px solid var(--rc);border-right:1px solid var(--rc);opacity:.7}
.hf-por{position:relative}.hf-por .por{border:2px solid var(--rc);border-radius:0}
.hf-rk{position:absolute;right:-10px;bottom:-10px;background:var(--rc);color:#0b0f14;padding:2px 9px;display:flex;align-items:baseline;gap:1px;box-shadow:0 2px 10px #0008}.hf-rk b{font-family:var(--f-display);font-size:26px;line-height:1}.hf-rk span{font-size:11px;font-weight:700}
.hf-tag{font-family:var(--f-num);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.hf-nm{font-family:var(--f-display);font-size:34px;line-height:1.1;margin:4px 0 2px}
.hf-sub{color:var(--fg);font-size:13px}
.hf-guild{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}.hf-guild small{color:var(--muted);margin-left:4px}
.hf-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.hf-grid>div{background:#0f1620;padding:7px 9px;display:grid;gap:2px;min-width:0}.hf-grid span{font-size:10px;color:var(--muted);letter-spacing:.04em}.hf-grid b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.hprof{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:10px;align-items:start}
.hbox{border-radius:0}.hbox>.hd{background:#141c27;color:#a9b8c9;letter-spacing:.04em}
.frm{display:grid;gap:4px;background:repeating-linear-gradient(0deg,#121a24 0 22px,#141e29 22px 44px);border:1px solid var(--line);padding:6px}
.frow{display:flex;align-items:center;gap:5px;min-height:28px}.fl{width:30px;font-size:10px;color:var(--dim);letter-spacing:.08em}
.ftk{font:600 11px var(--f-num);padding:3px 7px;border:1px solid var(--line2);color:var(--dim);background:#0f151d}
.ftk.ok{color:var(--fg)}.ftk.subr{border-color:#4fa8e0;color:#9fd2f5}.ftk.main{border-color:var(--good);background:#16301f;color:#bff0d2}
@media (max-width:1200px){.hf{grid-template-columns:auto minmax(0,1fr)}.hf-grid{grid-column:1/-1}.hprof{grid-template-columns:minmax(0,1fr)}}
/* ---------- (이전) FM식 헌터 정보창 — 다른 탭에서 쓰는 공용 스타일 ---------- */
.pf-head{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.pf-head .nm{font-family:var(--f-display);font-size:24px;line-height:1.1}
.pf-head .ds{font-size:12px;color:var(--muted)}
.pf-head .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.prof{display:grid;grid-template-columns:240px minmax(0,1fr) 250px;gap:10px;align-items:start}
.prof .pcol.c4{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr))}
.pcol{display:grid;gap:10px;min-width:0}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.pbox>.hd{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;flex-wrap:wrap}
.pbox>.bd{padding:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px;font-size:11px;color:var(--muted)}
.trio b{display:block;color:var(--fg);font-size:14px;font-family:var(--f-num)}
.trio b.hl{color:var(--warn)}
.value{text-align:center;padding:6px;border:1px solid var(--line2);border-radius:3px;font-weight:600;font-size:12px;background:var(--panel2)}
.stars{position:relative;display:inline-block;color:#3a4657;letter-spacing:1px;font-size:13px;white-space:nowrap;line-height:1}
.stars .on{position:absolute;inset:0 auto 0 0;overflow:hidden;color:var(--warn);white-space:nowrap}
.idcard{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:6px}
.idcard .mid{border:1px solid var(--line2);border-radius:4px;background:linear-gradient(180deg,#1d2a3c,#131b27);text-align:center;padding:8px 4px}
.idcard .mid .r{font-family:var(--f-display);font-size:40px;line-height:1}
.idcard .mid .n{font-size:11px;color:var(--muted);margin-top:4px}
.idcard .sd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);text-align:center}
.flag{width:40px;height:28px;border-radius:3px;display:grid;place-items:center;font-size:10px;font-weight:700;background:#26364b;color:#9fb6d0;border:1px solid var(--line2)}
.rings{display:flex;justify-content:space-around;gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted)}
.ring svg{width:64px;height:64px}
.ring text{font-family:var(--f-num);font-size:13px;font-weight:600;fill:var(--fg)}
.plist{display:flex;flex-direction:column;gap:3px;font-size:12px;text-align:center}
.pf-attrs{display:grid;grid-template-columns:minmax(0,3fr) minmax(130px,1fr);gap:10px}
.acols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.acol h5{margin:0 0 3px;font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);padding:2px 4px 4px}
.acol h5+.ar{margin-top:2px}
.acol .ar:last-child{margin-bottom:8px}
.ar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 6px;font-size:12px;border-radius:2px}
.ar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ar.key{background:var(--keyrow)}
.ar .av{font-family:var(--f-num);font-weight:600;min-width:20px;text-align:right}
.abin{width:42px;background:var(--bg);border:1px solid var(--line2);border-radius:3px;color:inherit;font:600 12px var(--f-num);text-align:right;padding:1px 4px}
.abin:focus{outline:2px solid var(--accent);outline-offset:0}
.abstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:6px}
.abstrip>div{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.abstrip .k{font-size:10px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.abstrip .v{font:600 15px var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abstrip .v.sm{font-size:13px}
.abstrip .abin{width:100%;font-size:14px}
.abtot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.abtot b{color:var(--fg);font-family:var(--f-num)}
.absec{margin-top:12px}
.absec>.ph{display:flex;justify-content:space-between;gap:8px}
.v1{color:var(--a1)}.v2{color:var(--a2)}.v3{color:var(--a3)}.v4{color:var(--a4)}
.aside{display:flex;flex-direction:column;gap:6px;font-size:11px}
.aside .it{border:1px solid var(--line);border-radius:3px;padding:5px 6px;text-align:center;background:var(--panel2)}
.aside .it .k{color:var(--dim);font-size:10px}
.aside .it .v{font-weight:600;font-size:12px}
.formbars{display:flex;gap:3px;align-items:flex-end;height:40px}
.formbars i{flex:1;background:var(--good);border-radius:2px 2px 0 0;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;text-align:center}
.hgrid .v{font-family:var(--f-num);font-weight:600;font-size:15px}
.hgrid .k{font-size:10px;color:var(--muted);line-height:1.2}
.pitch{position:relative;aspect-ratio:1.25/1;background:linear-gradient(180deg,#16251d,#132019);border:1px solid #2a4434;border-radius:4px;overflow:hidden}
.pitch::before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:1px dashed #2f5040}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:1px dashed #2f5040;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .lbl{position:absolute;left:6px;font-size:9px;color:#5f8a72;letter-spacing:.1em}
.pitch .pd{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0b0f14;z-index:1}
.pitch .pd.main{width:20px;height:20px;background:var(--good);box-shadow:0 0 0 3px #5cc48a44}
.pitch .pd.subr{background:#9ad9b3}
.pitch .pd.ok{background:#d08a3c}
.pitch .pd.no{background:#3a4657}
.rlist{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.rli{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 6px;border-radius:3px;background:var(--panel2)}
.rli.main{background:#1d3a2b}
.rli .nmr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rli .kd{font-size:10px;color:var(--dim)}

.tp-top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.tp-pts{display:flex;align-items:center;gap:8px;padding-bottom:2px;white-space:nowrap}
.tp-sel{display:flex;flex-wrap:wrap;gap:4px;min-height:32px;margin-bottom:10px;padding:6px;border:1px dashed var(--line2);border-radius:4px;align-items:center}
.tp-sel .chip button{all:unset;cursor:pointer;margin-left:2px;padding:0 2px;color:var(--fg)}
.tp-sel .chip button:focus-visible{outline:2px solid var(--accent)}
.tp{display:grid;grid-template-columns:170px minmax(0,1fr) 260px;gap:10px;height:max(380px,calc(100vh - 380px))}
.tp-cats{display:flex;flex-direction:column;overflow-y:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:4px 0}
.tp-cats button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:6px;padding:7px 10px;font-size:12px;color:var(--muted);border-left:3px solid transparent}
.tp-cats button:hover{background:var(--panel2);color:var(--fg)}
.tp-cats button[aria-current="true"]{color:var(--fg);background:var(--panel2);border-left-color:var(--accent);font-weight:600}
.tp-cats button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tp-cats .num{color:var(--dim);font-size:11px}
.tp-cats hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.tp-mid{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.tlist{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel);position:relative}
.tlist:focus-visible{outline:2px solid var(--accent)}
.tl-in{position:relative}
.trow{position:absolute;left:0;right:0;height:34px;display:grid;grid-template-columns:20px minmax(0,1fr) auto 34px;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.trow:hover{background:var(--panel2)} .trow.fx{background:#20304a} .trow.on .tn{color:var(--accent);font-weight:600}
.tchk{all:unset;cursor:pointer;width:16px;height:16px;border:1px solid var(--line2);border-radius:3px;display:grid;place-items:center;font-size:11px;color:var(--accent-ink);font-weight:700}
.tchk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc{font-size:10px;color:var(--dim);white-space:nowrap}
.tcost{font-family:var(--f-num);font-weight:600;text-align:right}
.tp-det{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px;overflow-y:auto;font-size:13px}
.tempty{padding:24px;text-align:center;color:var(--muted)}
.lk{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.lk-items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--panel);max-height:max(320px,calc(100vh - 380px));overflow-y:auto}
.lk-item{all:unset;cursor:pointer;display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px;border-left:3px solid transparent}
.lk-item:hover{background:var(--panel2)}
.lk-item[aria-current="true"]{background:var(--panel2);border-left-color:var(--accent);font-weight:600}
.lk-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lk-item .k{color:var(--muted)} .lk-item[aria-current="true"] .k{color:var(--fg)}
.lk-item .v{display:flex;gap:6px;align-items:flex-start;min-width:0}
.lk-item .tx,.lk-cur .tx{min-width:0;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:keep-all;line-height:1.5}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid #ffffff40;flex:none}
.lk-panel{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:14px;min-width:0}
.lk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.lk-head h3{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:20px}
.lk-cur{display:flex;gap:6px;align-items:flex-start;font-weight:600;min-width:0;max-width:100%}
.lk-cur .sw{width:16px;height:16px}
.lk-tools{display:flex;flex-direction:column;gap:8px;margin:12px 0 10px}
.lk-tools input{background:var(--bg);border:1px solid var(--line2);border-radius:3px;color:var(--fg);padding:7px 9px;font:inherit;width:100%}
.lk-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr));gap:6px;max-height:max(260px,calc(100vh - 520px));overflow-y:auto;padding:2px}
.lk-tiles.k-swatch{grid-template-columns:repeat(auto-fill,minmax(min(100%,84px),1fr))}
.lk-tiles.k-thumb{grid-template-columns:repeat(auto-fill,minmax(min(100%,96px),1fr))}
.lk-tile{all:unset;cursor:pointer;border:1px solid var(--line2);border-radius:4px;background:var(--panel2);padding:8px 6px;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.lk-tile:hover{border-color:var(--accent)}
.lk-tile[aria-pressed="true"]{border-color:var(--accent);background:#1c3047;box-shadow:0 0 0 1px var(--accent)}
.lk-tile:focus-visible{outline:2px solid var(--accent)}
.lk-tile>.choice-label{max-width:100%;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.lk-tile small{font-size:9px;color:var(--dim);font-family:var(--f-num)}
.lk-sec{font-size:10px;letter-spacing:.14em;color:var(--dim);padding:10px 10px 4px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:1}
.mt{font-size:9px;border:1px solid #245272;border-radius:3px;padding:0 3px;color:var(--accent);font-weight:500;letter-spacing:0;vertical-align:1px}
.lk-tile{position:relative}
.lk-tile .ck{position:absolute;top:5px;left:5px;width:14px;height:14px;border:1px solid var(--line2);border-radius:3px;font-size:10px;display:grid;place-items:center;font-weight:700}

<script>
/* =========================================================
   공통 유틸
   ========================================================= */
const DB = HLDB;
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n=>(n<0?'−':'')+'₩'+Math.abs(Math.round(n)).toLocaleString('ko-KR');
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const vals=t=>Object.values(DB[t]||{});
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hashStr(String(seed));return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gauss=r=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
/* 활동 기록 (홈 위젯 WG_LOG): 시간 진행 · 행동 결과를 쌓는다. 오른쪽 아래 팝업은 설정(SETTINGS.actToast)을 켰을 때만 (사용자 요청 2026-10-23) */
const ACTLOG_KEEP=200;
function actLog(k,s,t){const L=G.actLog||(G.actLog=[]);L.unshift({t:t??nowAbs(),k,s:String(s)});if(L.length>ACTLOG_KEEP)L.length=ACTLOG_KEEP}
function actNote(html){if(SETTINGS.actToast)toast(html)}
function toast(t){const el=$('#toast');el.innerHTML=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3400)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* 설정 (브라우저에 저장되는 개인 설정) */
const SETTINGS = Object.assign({showTrig:true, autosave:true, intro:true, fontSize:13, raidSpeed:1, textSpeed:'보통'}, store.get('khl.settings',{}));
function applySettings(){document.body.classList.toggle('no-trig',!SETTINGS.showTrig);document.documentElement.style.setProperty('--fs',SETTINGS.fontSize+'px');store.set('khl.settings',SETTINGS)}

/* =========================================================
   데이터 조회 (모든 참조는 ID)
   ========================================================= */
let G = null;   // 현재 게임 상태 (세이브 데이터)
const UI = {mode:'title', panel:null, screen:'life', profileId:null, profTab:'개요', attrView:'ABS_A', alert:null, thWith:null, newsCat:'전체',
  gateSel:null, squadTab:'파티', dbTab:'PEOPLE', dbQ:'', dbF:'ALL', dbSel:null, tactic:'균형', editHome:false, moving:null, pickCell:null, raid:null, cc:null};

const SLOTS=['오전','오후','저녁','밤'];
const WEEK='월화수목금토일';
const dateOf=day=>{const d=new Date(2026,2,9+day);return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate(),w:WEEK[(day%7+7)%7]}};
const RANK_IDS=()=>Object.keys(DB.ranks);
/* ---------- 시간 · 기력 · 행동 (분 단위 세계 시간 하나. 행동을 하면 그만큼 시간이 흐른다) ---------- */
const inTime=(t,from,to)=>from<=to?(t>=from&&t<to):(t>=from||t<to);
const SLOT_RANGE=[[360,720],[720,1080],[1080,1320],[1320,360]];
const slotOf=t=>t>=360&&t<720?0:t>=720&&t<1080?1:t>=1080&&t<1320?2:3;
const hhmm=t=>{t=((Math.round(t)%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const durTxt=m=>m>=60?(m%60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m/60}시간`):`${m}분`;
const nowAbs=()=>G.day*1440+G.time;
const wd=d=>((d%7)+7)%7;
function schedFromTpl(id){const t=DB.schedTemplates[id]||vals('schedTemplates')[0];return Array.from({length:7},(_,d)=>clone(d<5?t.weekday:t.weekend))}
function energyMax(){const B=DB.balance.BAL_TIME;return Math.max(B.energyFloorMax,Math.round(B.energyMax-(G.cond.sleepDebt||0)*B.debtPenalty))}
/* 이전 세이브 보정: 4칸 일정 · 피로 → 시간 블록 · 기력 */
function ensureTime(){
  if(G.time==null) G.time=[480,780,1140,1380][G.slot||0];
  if(G.cond.energy==null) G.cond.energy=clamp(100-(G.cond.fatigue??30));
  delete G.cond.fatigue; if(G.cond.sleepDebt==null) G.cond.sleepDebt=0;
  if(!Array.isArray(G.schedule)||!G.schedule.length||typeof G.schedule[0]?.[0]==='string') G.schedule=schedFromTpl(G.player.guild?'SCH_GUILD':'SCH_SOLO');
  G.lastDay=G.lastDay??G.day; G.startDay=G.startDay??G.day; G.layout=(G.layout||[]).filter(o=>WIDGETS[o.id]); syncGenGates(); syncNpcState(); syncGuildState(); syncMyGuild(); if(!G.pop) SIM.init(); else if(SIM.owner!==G.created) SIM.regen(); if(G.simDay==null) SIM.day(G.day);  /* 시작한 날의 NPC 하루도 계획해 둔다 */
  (G.scouted||[]).forEach(id=>{if(!KNOW.get(id,'report')&&H(id)){KNOW.report(H(id));G.know[id].report.src='KS_OLD'}});G.scouted=[];  /* 예전 '스카우트 완료' 목록 → 보고서 */
  (G.relations||[]).forEach(ensureRel); G.gStart=G.gStart??nowAbs(); G.injuries=G.injuries||[]; if(typeof GEAR!=='undefined'){GEAR.fixSave();STAR.ensure()} G.train=G.train||{log:[],prog:{}}; G.timeLog=G.timeLog||[]; G.stopOn=G.stopOn||{event:true,lowEnergy:true}; G.slot=slotOf(G.time);
}
function advanceClock(min){G.time+=min;while(G.time>=1440){G.time-=1440;G.day++}G.slot=slotOf(G.time)}
/* 일정 블록: 앞뒤 하루까지 절대 시각(분)으로 펼친다. 자정을 넘는 블록도 처리 */
function blocksNear(abs){const d=Math.floor(abs/1440),out=[];
  for(let k=d-1;k<=d+1;k++)(G.schedule[wd(k)]||[]).forEach((b,i)=>out.push({s:k*1440+b.at,e:k*1440+b.at+b.dur,act:b.act,day:wd(k),i}));
  return out.sort((a,b)=>a.s-b.s)}
const blockAt=abs=>blocksNear(abs).find(b=>b.s<=abs&&abs<b.e)||null;
function nextBlock(abs){for(let k=0;k<8;k++){const L=blocksNear(abs+k*1440).filter(b=>b.s>abs);if(L.length)return L[0]}return null}
const actCost=(a,dur)=>SIM.cost(a,dur,G.player.jobPay||0); /* 플레이어 · NPC 공통 규칙 (engine/sim.js) */
/* 행동 상태: ok(가능) · why(조건 부족 → 못 함) · warn(위험 · 효율 저하 → 할 수는 있음) */
function actCheck(a,dur,cont,target,context={}){const why=[],warn=[],t=context.time??G.time,cost=actCost(a,dur),tr=target?relOf(target):null,tp=target?P(target):null;
  (a.req||[]).forEach(q=>{
    if(q.k==='hasGuild'&&!G.player.guild)why.push('길드 소속이어야 합니다');
    if(q.k==='noGuild'&&G.player.guild)why.push('무소속일 때만');
    if(q.k==='startBetween'&&!cont&&(t<q.from||t>q.to))why.push(`${hhmm(q.from)}~${hhmm(q.to)} 사이에 시작할 수 있습니다`);
    if(q.k==='money'&&(context.money??G.money)<q.min)why.push('돈이 부족합니다');
    if(q.k==='injured'&&!(G.injuries||[]).length)why.push('치료할 부상이 없습니다');
    if(q.k==='adultTarget'&&(!isAdultP(tp)||!isAdultP(G.player)))why.push('성인끼리만 할 수 있습니다');
    if(q.k==='notFamily'&&tr&&isFam(tr))why.push('가족에게는 할 수 없습니다');
    if(q.k==='notDating'&&tr&&DB.relStatus[tr.status]?.romance)why.push('이미 연인 관계입니다');
    if(q.k==='dating'&&!(tr&&DB.relStatus[tr.status]?.romance))why.push('연인 사이여야 합니다');
    if(q.k==='targetFree'&&target){const w=npcWhere(target);if(w?.busy)why.push(`${nameOf(target)}: ${w.busy}`)}
    if(q.k==='hasJob'&&!G.player.jobPay)why.push('직업이 없습니다');
    if(q.k==='guildMaster'&&!isMaster())why.push('내가 세운 길드의 길드장이어야 합니다');
    if(q.k==='engaged'&&tr?.status!=='RS_ENGAGED')why.push('약혼한 사이여야 합니다');
    if(q.k==='notCohabit'&&homeOf().partner)why.push(homeOf().partner===target?'이미 같이 살고 있습니다':'다른 사람과 같이 살고 있습니다');
    if(q.k==='homeStorage'&&!DB.housing[homeOf().type].storage)why.push('둘이 살 수 있는 집이 아닙니다 (고시원)')});
  if(cost.pay<0&&(context.money??G.money)<-cost.pay)why.push('돈이 부족합니다');
  if(cost.energy<0&&G.cond.energy<-cost.energy)warn.push('기력 부족 — 훈련 효율이 떨어집니다');
  return {ok:!why.length,why,warn,cost}}
/* 훈련 효율 (수확 체감): 오늘 · 최근 7일 같은 그룹 훈련량, 잠재 상한 근접도 */
function trainEff(g){const T=DB.balance.BAL_TRAIN,now=nowAbs(),h=G.player,L=(G.train?.log||[]).filter(x=>x.g===g);
  const today=L.filter(x=>Math.floor(x.t/1440)===G.day).reduce((a,x)=>a+x.min,0), week=L.filter(x=>x.t>now-7*1440).reduce((a,x)=>a+x.min,0);
  const cap=h.pot?.cap||1e9, {fd,fw,fc}=SIM.trainFactor(today,week,ablSum(h)/cap);

/* 시작 능력치 생성. mode: real = 현실적(기본), rand = 완전 무작위. 값 범위는 ccRules.RULE_START.gen */
function genStart(mode,r){
  const g=DB.ccRules.RULE_START.gen, B=DB.balance.BAL_GROWTH, cl=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v))), ui=(a,b)=>a+Math.floor(r()*(b-a+1));
  const stats={}; vals('baseStats').forEach(st=>stats[st.id]=mode==='rand'?ui(g.stat.min,g.stat.max):cl(g.stat.mean+gauss(r)*g.stat.sd,g.stat.min,g.stat.max));
  const sets=['ABS_A','ABS_B'], abl={};
  sets.forEach(set=>ablIn(set).forEach(a=>{abl[a.id]=mode==='rand'?ui(...g.rand[set]):cl(g.real[set].mean+gauss(r)*g.real[set].sd,B.ablMin,B.ablMax)}));
  const pl=g.potLevel, lv=mode==='rand'?ui(pl.min,pl.max):cl(pl.min+Math.pow(r(),pl.skew)*(pl.max-pl.min),pl.min,pl.max);
  const tot=Object.values(abl).reduce((a,b)=>a+b,0), mx=ablMaxOf(sets), pc=g.potCap;
  const ex=mode==='rand'?ui(0,mx-tot):Math.max(pc.extraMin,Math.round(pc.extraMean+gauss(r)*pc.extraSd));
  const looks={};vals('lookScores').forEach(k=>looks[k.id]=mode==='rand'?ui(1,20):cl(10+gauss(r)*3,1,20));
  return {mode, stats, abl, looks, pot:{level:lv, cap:Math.min(mx,tot+ex)}};
}

function saveGame(slot){

  let ok=store.set(SAVE_KEY,saves);
  /* 저장 공간이 모자라면 (이 저장이 아닌) 오래된 자동 저장부터 지우고 다시 시도 */
  while(!ok){const autos=saves.filter(s=>s.slot.startsWith('auto')&&s.slot!==slot).sort((a,b)=>a.savedAt-b.savedAt);if(!autos.length)break;saves.splice(saves.indexOf(autos[0]),1);ok=store.set(SAVE_KEY,saves);if(ok)toast('저장 공간이 부족해 오래된 자동 저장을 지웠습니다.')}

}

function applyFx(fx={},tgt){
  const out=[], sg=v=>(v>0?'+':'')+v, dt=dateOf(G.day);
  if(fx.rep){G.rep+=fx.rep;out.push('평판 '+sg(fx.rep))}
  if(fx.fatigue)fx={...fx,energy:(fx.energy||0)-fx.fatigue};
  if(fx.energy){G.cond.energy=clamp(G.cond.energy+fx.energy,0,energyMax());out.push('기력 '+sg(fx.energy))}
  if(fx.stress){G.cond.stress=clamp(G.cond.stress+fx.stress);out.push('스트레스 '+sg(fx.stress))}
  if(fx.hp){G.cond.hp=clamp(G.cond.hp+fx.hp);out.push('체력 '+sg(fx.hp))}
  if(fx.money){G.money+=fx.money;G.ledger.unshift([`${dt.m}/${dt.d}`,'이벤트',fx.money]);out.push('자금 '+(fx.money>0?'+':'−')+Math.abs(fx.money).toLocaleString()+'원')}
  if(fx.rel){const [t,k,v]=fx.rel, id=t==='T'?tgt:t, r=relOf(id); if(r){relAdd(r,REL_KEY[k]||k,v,'both');out.push(`${nameOf(id)} ${({love:'호감',close:'친밀도',trust:'신뢰'})[k]} ${sg(v)}`)}}
  (fx.relDim||[]).forEach(([t,dim,v,dir])=>{const id=t==='T'?tgt:t,r=relOf(id);if(r){relAdd(r,dim,v,dir||'both');out.push(`${nameOf(id)} ${DB.relDims[dim].name} ${sg(v)}`)}});
  if(fx.relStatus){const id=fx.relStatus[0]==='T'?tgt:fx.relStatus[0],r=relOf(id);if(r){r.status=fx.relStatus[1];pushHistory(`${nameOf(id)}: ${DB.relStatus[r.status].name}`,'');out.push(`${nameOf(id)}: ${DB.relStatus[r.status].name}`)}}
  if(fx.injury){out.push('부상: '+addInjury(fx.injury.part||'rand',fx.injury.type,fx.injury.sev||1))}
  if(fx.item){const [id,q]=fx.item;if(q>0)invAdd(id,q,'LOC_BAG');else{let n=-q;invOf().forEach((r,i)=>{if(n>0&&r.item===id){const k=Math.min(n,r.qty);r.qty-=k;n-=k}});G.inv=invOf().filter(r=>r.qty>0)}out.push(`${DB.items[id].name} ${sg(q)}`)}
  if(fx.exp){out.push('EXP '+sg(fx.exp));addExp(fx.exp).forEach(x=>out.push(x))}
  if(fx.emo&&typeof EMO!=='undefined')Object.entries(fx.emo).forEach(([k,v])=>EMO.add(k,v));
  if(fx.retire){G.retirePending=true;out.push('은퇴')}
  if(fx.flag){G.flags=G.flags||{};G.flags[fx.flag]=G.day}
  if(fx.unflag&&G.flags)delete G.flags[fx.unflag];
  return out;
}

let bgRAF=null;
function startBg(){
  const cv=$('#bgfx'); if(!cv) return; const ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const r=rng('skyline'); const towers=Array.from({length:46},()=>({w:.012+r()*.03,h:.08+r()*.26,lit:r()}));
  const motes=Array.from({length:70},()=>({a:r()*Math.PI*2,d:.08+r()*.5,s:.0006+r()*.002,z:r()}));
  function frame(t){
    if(!document.body.contains(cv)) return;
    const dpr=devicePixelRatio||1, W=cv.width=cv.clientWidth*dpr, Hh=cv.height=cv.clientHeight*dpr;
    const narrow=innerWidth<760, cx=W*(narrow?.5:.7), cy=Hh*(narrow?.3:.42), R=Math.min(W,Hh)*(narrow?.3:.26);
    ctx.fillStyle='#06090e';ctx.fillRect(0,0,W,Hh);
    let g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*2.6);g.addColorStop(0,'#2a5a8a55');g.addColorStop(1,'#06090e00');ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
    const rot=reduce?0:t/9000;
    for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(cx,cy,R*(1+i*.07),R*(1+i*.07)*.92,rot*(i%2?-1:1)+i,0,Math.PI*2);ctx.strokeStyle=`rgba(${110+i*20},${170+i*10},255,${.5-i*.08})`;ctx.lineWidth=(6-i)*dpr;ctx.stroke()}
    g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,'#020306');g.addColorStop(.7,'#0a1424');g.addColorStop(1,'#3a7fc0');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,R*.97,R*.89,rot,0,Math.PI*2);ctx.fill();
    motes.forEach(m=>{const a=m.a+(reduce?0:t*m.s*.1);const d=R*(1.05+m.d);ctx.fillStyle=`rgba(150,200,255,${.2+m.z*.6})`;ctx.fillRect(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.9,1.6*dpr,1.6*dpr)});
    let x=0; towers.forEach((tw,i)=>{const w=tw.w*W,h=tw.h*Hh;ctx.fillStyle='#0a0f16';ctx.fillRect(x,Hh-h,w+1,h);
      ctx.fillStyle='#2a3f5a';for(let yy=Hh-h+8;yy<Hh-6;yy+=10*dpr)for(let xx=x+4;xx<x+w-4;xx+=8*dpr){if(((Math.floor(xx)*7+Math.floor(yy)*13+i)%11)<tw.lit*3)ctx.fillRect(xx,yy,2*dpr,3*dpr)}x+=w});
    g=ctx.createLinearGradient(0,0,W*.6,0);g.addColorStop(0,narrow?'#06090e99':'#06090ef2');g.addColorStop(1,'#06090e00');ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
    if(!reduce && UI.mode==='title') bgRAF=requestAnimationFrame(frame);
  }
  cancelAnimationFrame(bgRAF); bgRAF=requestAnimationFrame(frame);
}

/* ---------- 자동 설정: 무작위지만 서로 어긋나지 않게 ---------- */
const rpick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnorm=(m,sd)=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return m+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const rsample=(a,k)=>{const c=a.slice(),o=[];while(o.length<k&&c.length)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o};
function autoStep(cc,st){
  if(st===0){
    const pool=DB.namePool.NAMEPOOL_KR;
    cc.sex=rpick(['남','여']); cc.family=rpick(pool.family); cc.given=rpick(cc.sex==='남'?pool.male:pool.female);
    cc.age=Math.round(clamp(rnorm(27,6),19,50)); const mo=rint(1,12), dmax=[31,29,31,30,31,30,31,31,30,31,30,31][mo-1];
    cc.bday=`${String(mo).padStart(2,'0')}-${String(rint(1,dmax)).padStart(2,'0')}`;
    cc.blood=rpick(['A','A','A','B','B','O','O','AB']); cc.hand=Math.random()<.88?'오른손':Math.random()<.85?'왼손':'양손';
    const nats=vals('ccNations'); cc.nation=Math.random()<.85?'NAT_KR':rpick(nats).id;
    const bps=vals('ccBirthplaces').filter(b=>b.nat===cc.nation); cc.bplace=(bps.length?rpick(bps):DB.ccBirthplaces.BP_ETC).id;
    cc.langMain=DB.ccNations[cc.nation].lang||rpick(vals('ccLanguages')).id;
    cc.langs=rsample(vals('ccLanguages').map(l=>l.id).filter(l=>l!==cc.langMain),Math.random()<.5?0:rint(1,2));
    cc.voice=rpick(vals('ccVoices')).id; cc.speech=rpick(vals('ccSpeech')).id;
    ensureLook(cc);
  }
  if(st===1){
    if(!cc.sex) autoStep(cc,0);
    lookSet(cc.sex).items.forEach(id=>{const it=DB.ccLook[id]; if(!it) return;
      if(it.slider){const sl=it.slider;
        if(id==='LK_HEIGHT') cc.look[id]=Math.round(clamp(cc.sex==='남'?rnorm(174,6):rnorm(162,5),sl.min,sl.max));
        else if(id==='LK_WEIGHT'){const h=(cc.look.LK_HEIGHT||170)/100;cc.look[id]=Math.round(clamp(rnorm(cc.sex==='남'?23:21,2.5)*h*h,sl.min,sl.max))}
        else cc.look[id]=rint(sl.min,sl.max);
        return}
      const o=lookOptsFor(it,cc.sex); if(!o.length) return;
      cc.look[id]=o.length===5?o[Math.min(4,Math.floor((Math.random()+Math.random())*2.5))].id:rpick(o).id;
    });
  }
  if(st===2){
    ensureBg(cc);
    vals('bgItems').forEach(it=>{const o=bgOptsFor(it); if(!o.length) return;
      if(!it.multi){cc.bgv[it.id]=rpick(o).id;return}
      const none=o.find(x=>x.none), rest=o.filter(x=>!x.none);
      if(none&&Math.random()<.35){cc.bgv[it.id]=[none.id];return}
      cc.bgv[it.id]=rsample(rest,rint(1,Math.min(it.max||3,3))).map(x=>x.id);
    });
  }
  if(st===3) vals('ccPersonality').forEach(ax=>cc.pers[ax.id]=Math.round(clamp(rnorm(5.5,2.3),1,10)));
  if(st===4){
    const pool=vals('traits').filter(t=>t.pick!==false&&!t.id.startsWith('TR_S')); cc.traits=[];
    const want=Math.min(rint(1,4),traitRule().traitMax||9);

    cc._tl=null;
  }
  if(st===5){
    const c=rpick(vals('classes').filter(c=>!c.unique)); cc.cls=c.id; cc.clsSkills=rsample(c.pool,c.pick);
    cc.comSkills=rsample(vals('skills').filter(s=>s.scope==='common').map(s=>s.id),rint(0,DB.ccRules.RULE_START.commonSkills));
  }
  if(st===6) cc.ab=genStart('real',Math.random);
}

function awakeningElapsed(){
  const h=G.player;if(h.awake===false)return {text:'미각성',title:'아직 각성하지 않음'};

}

function qsResults(q){q=(q||'').trim();const lq=q.toLowerCase(),hit=(...xs)=>!q||xs.some(x=>String(x||'').toLowerCase().includes(lq)),out=[];
  if(!q){out.push(['바로 가기',[['내 정보창','hunter:'+G.player.id,'나'],['상태창','go:status',''],['내 길드','go:guild',guildName(G.player.guild)],['방향 · 목표','go:goals',''],['게이트','go:gates','']]]);}
  const known=new Map();[G.player,...allHunters(),...Object.values(G.genHunters||{})].forEach(h=>known.set(h.id,h));
  const ppl=[...known.values()].filter(h=>hit(h.name,h.id,DB.classes[h.cls]?.name)).slice(0,8).map(h=>[h.name,'hunter:'+h.id,`${DB.ranks[h.rank]?.name}급 ${DB.roles[h.roleMain]?.name||''} · ${guildName(h.guild)}`,h.rank]);
  const civ=[...vals('npcs'),...Object.values(G.genNpcs||{})].filter(n=>q&&hit(n.name,n.id,n.job)).slice(0,5).map(n=>[n.name,'npc:'+n.id,`일반인 · ${n.job||'—'}`]);
  const pop=q&&q.length>=2&&SIM.POP?SIM.search(q,'ALL',6).rows.filter(x=>!known.has(x.id)).map(x=>[x.name,x.awake?'hunter:'+x.id:'npc:'+x.id,x.awake?`${DB.ranks[x.rank]?.name}급 헌터 · ${guildName(x.guild)}`:`일반인 · ${x.job||'—'}`,x.rank]):[];
  if(q&&(ppl.length||civ.length||pop.length))out.push(['인물',[...ppl,...civ,...pop].slice(0,12)]);
  const gu=vals('guilds').filter(g=>q&&hit(g.name,g.id,regionName(g.region))).slice(0,6).map(g=>[g.name,'guild:'+g.id,`${DB.ranks[g.rank].name}급 · ${guildTier(g).name} · ${regionName(g.region)}`,g.rank]);if(gu.length)out.push(['길드',gu]);
  const ga=vals('gates').filter(g=>q&&gateSt(g.id).status==='open'&&hit(g.name,g.id,regionName(g.region),DB.monsters[g.mon]?.name)).slice(0,6).map(g=>[g.name,'gate:'+g.id,`${DB.ranks[g.rank].name}급 ${g.type} · ${regionName(g.region)} · ${gateLeftTxt(g)}`,g.rank]);if(ga.length)out.push(['게이트',ga]);
  const it=vals('items').filter(i=>q&&hit(i.name,i.id,DB.itemCats[i.cat]?.name)).slice(0,6).map(i=>[i.name,'item:'+i.id,`${DB.itemCats[i.cat]?.name||''}${i.rank?' · '+DB.ranks[i.rank].name+'급':''}`,i.rank]);if(it.length)out.push(['아이템',it]);
  const rg=vals('regions').filter(r=>q&&hit(r.name,r.id)).map(r=>[r.name,'region:'+r.id,`게이트 ${vals('gates').filter(g=>g.region===r.id&&gateSt(g.id).status==='open').length}곳`]);if(rg.length)out.push(['지역',rg]);
  const sc=NAV.flatMap(([,L])=>L).filter(([k,l])=>q&&hit(l)).map(([k,l])=>[l,'go:'+k,'화면']);if(sc.length)out.push(['화면',sc]);
  return out}

  return `<div class="qsbg" data-qsclose="1"></div><div class="qsp" role="dialog" aria-label="빠른 검색"><div class="qsin"><span>⌕</span><input id="qsq" value="${esc(Q.q)}" placeholder="이름 · 길드 · 게이트 · 아이템 · 지역 검색" autocomplete="off" aria-label="검색어"><kbd>Esc</kbd></div>

const MAPGRID={};
function mapGrid(mid){if(MAPGRID[mid])return MAPGRID[mid];const m=DB.maps[mid],n=m.grid,bin=atob(m.rle),g=new Uint8Array(n*n);let p=0;for(let i=0;i+2<bin.length;i+=3){const v=bin.charCodeAt(i),c=bin.charCodeAt(i+1)|bin.charCodeAt(i+2)<<8;g.fill(v,p,p+c);p+=c}return MAPGRID[mid]=g}

function mapCells(mid){if(MAPCELLS[mid])return MAPCELLS[mid];const g=mapGrid(mid),out={};for(let i=0;i<g.length;i++){const v=g[i];if(v)(out[v]=out[v]||[]).push(i)}return MAPCELLS[mid]=out}
function mapBase(mid){if(MAPBASE[mid])return MAPBASE[mid];const mp=DB.maps[mid],n=mp.grid,g=mapGrid(mid),byN={};mapAreasOf(mid).forEach(a=>byN[a.n]=a);
  const cv=document.createElement('canvas');cv.width=cv.height=n;const ctx=cv.getContext('2d'),im=ctx.createImageData(n,n),d=im.data;
  const live=v=>{const a=byN[v];return !!(a&&(a.region||a.to))};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,v=g[i],o=i*4;
    const r=x+1<n?g[i+1]:0,b=y+1<n?g[i+n]:0,l=x>0?g[i-1]:0,t=y>0?g[i-n]:0;

    else{const s=((x*7+y*13)%5)?0:3;d[o]=(lv?24:15)+s;d[o+1]=(lv?38:21)+s;d[o+2]=(lv?54:30)+s;d[o+3]=255}}

function mountMap(){const el=$('#gmap');if(!el)return;const mid=el.dataset.map,mp=DB.maps[mid],g=mapGrid(mid),n=mp.grid,byN={};mapAreasOf(mid).forEach(a=>byN[a.n]=a);
